x-app-build: &app-build
  context: ../server
  dockerfile: ../.devcontainer/Dockerfile
  target: app

x-app-common: &app-common
  env_file:
    - ../.env
  depends_on:
    database:
      condition: service_healthy
  networks:
    - default
    - traefik-public

services:
  database:
    image: postgis/postgis:18-3.6-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 5

  traefik:
    image: traefik:v3.6
    container_name: traefik-proxy
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-public"
      - "--entrypoints.web.address=:80"
    ports:
      - "${SERVER_PORT}:80"
      - "${TRAEFIK_PORT}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-public
    restart: unless-stopped

  client:
    <<: *app-common
    build:
      <<: *app-build
      args:
        SERVICE: client
    environment:
      SERVICE: client
      PORT: 4000
    volumes:
      - ../server/apps/client/src:/app/apps/client/src
      - ../server/libs/core-app/src:/app/libs/core-app/src
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client.rule=Host(`localhost`) && PathPrefix(`/client`)"
      - "traefik.http.routers.client.entrypoints=web"
      - "traefik.http.middlewares.client-stripprefix.stripprefix.prefixes=/client"
      - "traefik.http.routers.client.middlewares=client-stripprefix"
      - "traefik.http.services.client.loadbalancer.server.port=4000"

networks:
  traefik-public:
    name: traefik-public
    driver: bridge

volumes:
  pgdata:
