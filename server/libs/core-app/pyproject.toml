[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "core-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.8.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
]

[tool.setuptools.package-dir]
"core_app" = "src"
