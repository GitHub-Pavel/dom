[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "client"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "core-app",
]

[project.scripts]
dev = "client.main:start"

[tool.setuptools.package-dir]
"client" = "src"

[tool.uv]
package = true

[tool.uv.sources]
core-app = { workspace = true }
